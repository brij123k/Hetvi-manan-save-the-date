<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                "Cormorant Garamond",
                serif;

            background: #f3eeea;
        }

        .site {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            opacity: 1;
        }

        .site .second-page > * {
            opacity: 0;

            transform: translateY(60px);

            transition:
                opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site.revealed .second-page > *{
            opacity: 1;

            transform: translateY(0);
        }

        .site .second-page > *:nth-child(1) { transition-delay: 0.05s; }
        .site .second-page > *:nth-child(2) { transition-delay: 0.15s; }
        .site .second-page > *:nth-child(3) { transition-delay: 0.25s; }
        .site .second-page > *:nth-child(4) { transition-delay: 0.35s; }
        .site .second-page > *:nth-child(5) { transition-delay: 0.45s; }
        .site .second-page > *:nth-child(6) { transition-delay: 0.55s; }
        .site .second-page > *:nth-child(7) { transition-delay: 0.65s; }


        /* =========================================
           FIRST OPENING PAGE
        ========================================= */

        .opening-page {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 999999;

            background: #E1DBCA;

            cursor: pointer;

            overflow: hidden;

            opacity: 1;

            visibility: visible;

            transform: scale(1);

            transition:
                opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .opening-page.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .opening-page-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
            object-position: center;
        }

        /* =========================================
           MAIN WEDDING PAGE
        ========================================= */

        .second-page {
            width: 100%;
            min-height: 100vh;

            position: relative;

            background-image:
                url("./bg.jpg.jpeg"),
                url("./bg2.png");

            background-size: cover, 100% auto;
            background-position: center top, center top;
            background-repeat: no-repeat, repeat-y;

            overflow: hidden;
        }


        /* =========================================
           DECORATIVE FLOWERS
        ========================================= */

        .floral-deco {
            position: absolute;

            width: 110px;
            height: auto;

            opacity: 0.95;

            pointer-events: none;
        }

        .floral-deco.deco-tr {
            top: 6px;
            right: 2px;

            transform: rotate(8deg);

            z-index: 2;
        }

        .floral-deco.deco-bl {
            bottom: 4px;
            left: 2px;

            transform:
                scaleX(-1)
                rotate(6deg);

            z-index: 0;

            width: 95px;
        }

        .floral-deco.deco-br {
            bottom: 4px;
            right: 2px;

            transform:
                rotate(190deg);

            z-index: 0;

            width: 100px;
        }


        /* =========================================
           ENVELOPE
        ========================================= */

        .envelope-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 40px 15px 0;

            position: relative;

            z-index: 1;
        }

        .envelope-wrapper {
            width: min(90%, 320px);
        }

        .envelope-card {
            width: 100%;
            height: auto;

            display: block;

            filter:
                drop-shadow(
                    0 15px 25px
                    rgba(0, 0, 0, 0.18)
                );
        }


        /* =========================================
           NOTE
        ========================================= */

        :root {
            --note-overlap: -70px;
            --story-overlap: -150px;
        }

        .note-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 15px 10px;

            position: relative;

            z-index: 2;

            margin-top:
                var(--note-overlap);
        }

        .note-wrapper {
            width: min(70%, 400px);
        }

        .note-card {
            width: 100%;
            height: auto;

            display: block;

            filter:
                drop-shadow(
                    0 10px 25px
                    rgba(0, 0, 0, 0.10)
                );
        }


        /* =========================================
           POST CARD
        ========================================= */

        .story-card-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 15px 50px;

            position: relative;

            z-index: 3;

            margin-top:
                var(--story-overlap);

            overflow: visible;
        }

        .story-card-wrapper {
            position: relative;

            width: min(88%, 440px);

            margin-top: 30px;

            margin-left: auto;
            margin-right: auto;
        }

        .post-card {
            width: 100%;
            height: auto;

            display: block;

            position: relative;

            z-index: 1;

            transform:
                rotate(-4deg);

            cursor: pointer;

            filter:
                drop-shadow(
                    0 15px 25px
                    rgba(0, 0, 0, 0.18)
                );

            transition:
                transform 0.3s ease;
        }

        .post-card:hover {
            transform:
                rotate(-4deg)
                scale(1.02);
        }


        /* =========================================
           VINYL
        ========================================= */

        .vinyl {
            position: absolute;

            width: 36%;
            height: auto;

            left: 0%;
            top: -14%;

            z-index: 5;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 10px 15px
                    rgba(0, 0, 0, 0.25)
                );

            animation:
                vinylFloat
                4s
                ease-in-out
                infinite;
        }

        .vinyl.is-playing {
            animation:
                vinylSpin
                2.4s
                linear
                infinite;
        }

        @keyframes vinylSpin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }

        @keyframes vinylFloat {

            0% {
                transform:
                    translateY(0)
                    rotate(-4deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }

            100% {
                transform:
                    translateY(0)
                    rotate(-4deg);
            }

        }


        /* =========================================
           COUNTDOWN
        ========================================= */

        .countdown-section {
            width: 100%;

            text-align: center;

            padding:
                30px
                20px
                60px;

            position: relative;

            z-index: 1;
        }

        .countdown-heading {
            width: min(100%, 420px);

            height: auto;

            display: inline-block;

            margin-bottom: 30px;
        }

        .countdown {
            display: flex;

            justify-content: center;

            align-items: flex-start;

            gap: 6px;
        }

        .time-box {
            min-width: 78px;

            text-align: center;
        }

        .time-number {
            font-family:
                "Times New Roman",
                Times,
                serif;

            font-weight: 600;

            font-size: 44px;

            color: #c69973;

            letter-spacing: 1px;

            font-variant-numeric: lining-nums;

            font-feature-settings: "lnum" 1, "tnum" 1;
        }

        .time-label {
            margin-top: 18px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-weight: 600;

            font-size: 14px;

            letter-spacing: 2px;

            color: #2c2a28;

            white-space: nowrap;
        }

        .separator {
            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 34px;

            font-weight: 600;

            color: #c69973;
        }


        /* =========================================
           LEAF DECORATION (bottom-left corner)
        ========================================= */

        .leaf-deco {
            position: absolute;

            bottom: -10px;
            left: -10px;

            width: 150px;
            height: auto;

            z-index: 4;

            pointer-events: none;

            opacity: 0.95;
        }


        /* =========================================
           WEDDING IMAGE
        ========================================= */

        .wedding-section {
            position: relative;

            width: 100%;

            height: 400px;

            overflow: hidden;
        }

        .wedding-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;
        }


        /* =========================================
           RSVP
        ========================================= */

        .rsvp-section {
            width: 100%;

            min-height: 400px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 70px 20px;

            position: relative;

            overflow: visible;
        }

        .rsvp-content {
            width: 100%;

            max-width: 500px;
        }

        .rsvp-heading {
            width: min(90%, 420px);

            height: auto;

            display: block;

            margin: 0 auto 30px;
        }

        .rsvp-buttons {
            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: nowrap;
        }

        .rsvp-button {
            min-width: 145px;

            padding:
                14px
                18px;

            border: none;

            border-radius: 3px;

            cursor: pointer;

            color: white;

            font-family:
                "Montserrat",
                sans-serif;

            font-size: 9px;

            letter-spacing: 1.5px;

            transition:
                transform
                0.3s
                ease;
        }

        .rsvp-button:hover {
            transform:
                translateY(-3px);
        }

        .yes-button {
            background: #8d9189;
        }

        .no-button {
            background: #a48e83;
        }


        /* =========================================
           OUR STORY OVERLAY
        ========================================= */

        .story-overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 9999;

            background-image:
                url("./background2.jpg");

            background-size: cover;

            background-position:
                center center;

            background-repeat: no-repeat;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity
                0.5s
                ease;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 18px;

            padding: 60px 12px 24px;
        }

        .story-overlay.active {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        /* =========================================
           CLOSE BUTTON
        ========================================= */

        .story-close {
            position: absolute;

            top: 20px;
            right: 20px;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.75);

            color: #5b5149;

            font-size: 24px;

            cursor: pointer;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================================
           STORY SLIDER
        ========================================= */

        .story-slider-area {
            position: relative;

            width: min(90vw, 720px);

            height: min(56vh, 470px);

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: visible;

            flex: 0 1 auto;

            touch-action: pan-y;

            margin-top: 40px;
        }

        .story-card {
            position: absolute;

            width: min(56vw, 340px);

            height: 100%;

            padding: 0;

            background: transparent;

            border: none;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 12px 30px
                rgba(67, 51, 35, 0.25);

            transition:
                transform
                0.6s
                cubic-bezier(.22,.61,.36,1),

                opacity
                0.6s
                ease;

            opacity: 0;
        }

        .story-card.active {
            z-index: 10;

            transform:
                translateX(0)
                scale(1);

            opacity: 1;
        }

        .story-card.prev {
            z-index: 3;

            transform:
                translateX(-52%)
                rotate(-4deg)
                scale(0.9);

            opacity: 0.9;
        }

        .story-card.next {
            z-index: 3;

            transform:
                translateX(52%)
                rotate(4deg)
                scale(0.9);

            opacity: 0.9;
        }

        .story-card.hidden-left {
            z-index: 1;

            transform:
                translateX(-140%)
                scale(0.8);

            opacity: 0;
        }

        .story-card.hidden-right {
            z-index: 1;

            transform:
                translateX(140%)
                scale(0.8);

            opacity: 0;
        }

        .story-year {
            position: absolute;

            top: 14px;

            left: 50%;

            transform:
                translateX(-50%);

            font-family:
                "Montserrat",
                sans-serif;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 3px;

            color: #fff;

            padding: 5px 14px;

            background:
                rgba(0, 0, 0, 0.28);

            border-radius: 20px;

            z-index: 5;
        }

        .story-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            display: block;
        }

        .story-navigation {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 45px;

            z-index: 50;

            flex: 0 0 auto;
        }

        .story-nav-btn {
            border: none;

            background: transparent;

            color: #554a43;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 62px;

            cursor: pointer;

            padding: 0 8px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            :root {
                --note-overlap: -50px;
                --story-overlap: -110px;
            }

            .floral-deco {
                width: 70px;
            }

            .floral-deco.deco-bl {
                width: 62px;
            }

            .floral-deco.deco-br {
                width: 66px;
            }

            .leaf-deco {
                width: 100px;

                bottom: -6px;
                left: -6px;
            }

            .second-page {
                background-size: 100% auto, 100% auto;

                background-position:
                    center top,
                    center top;

                background-repeat:
                    no-repeat,
                    repeat-y;
            }

            .envelope-section {
                padding:
                    26px
                    10px
                    0;
            }

            .note-section {
                padding:
                    0
                    10px
                    10px;
            }

            .story-card-section {
                padding:
                    0
                    10px
                    40px;
            }

            .story-card-wrapper {
                margin-top: 30px;
            }

            .vinyl {
                width: 35%;

                top: -12%;
            }

            .countdown-heading {
                width:
                    min(92%, 340px);

                margin-bottom: 22px;
            }

            .countdown {
                gap: 2px;
            }

            .time-box {
                min-width: 58px;
            }

            .time-number {
                font-size: 30px;
            }

            .time-label {
                font-size: 8.5px;

                letter-spacing: 1.2px;
            }

            .separator {
                font-size: 28px;
            }

            .wedding-section {
                height: 310px;
            }

            .rsvp-section {
                min-height: 350px;

                padding:
                    60px
                    15px;
            }

            .rsvp-buttons {
                gap: 10px;
            }

            .rsvp-button {
                min-width: 0;

                flex: 1 1 0;

                padding: 12px 8px;

                font-size: 8px;

                letter-spacing: 1px;
            }

            .story-overlay {
                padding-top: 195px;
            }

            .story-slider-area {
                width: 100%;

                height: min(46vh, 380px);

                margin-top: 45px;
            }

            .story-card {
                width: min(60vw, 300px);

                border-radius: 18px;
            }

            .story-navigation {
                gap: 35px;
            }

            .story-nav-btn {
                font-size: 55px;
            }

        }


        @media (max-width: 420px) {

            .story-card {
                width: min(64vw, 280px);
            }

        }


        /* =========================================
           SMALL PHONES (down to 320px)
        ========================================= */

        @media (max-width: 380px) {

            .story-card-wrapper {
                width: min(85%, 400px);
            }

            .post-card {
                transform: rotate(-3deg);
            }

            .post-card:hover {
                transform:
                    rotate(-3deg)
                    scale(1.02);
            }

            .envelope-section {
                padding: 20px 8px 0;
            }

            .note-section {
                padding: 0 8px 8px;
            }

            .story-card-section {
                padding: 0 8px 30px;
            }

            .vinyl {
                width: 33%;
            }

            .leaf-deco {
                width: 80px;

                bottom: -4px;
                left: -4px;
            }

            .countdown-heading {
                width: min(60%, 300px);

                margin-bottom: 18px;
            }

            .countdown-section {
                padding: 24px 10px 45px;
            }

            .countdown {
                gap: 0;
            }

            .time-box {
                min-width: 50px;
            }

            .time-number {
                font-size: 24px;
            }

            .time-label {
                font-size: 7.5px;

                letter-spacing: 1px;
            }

            .separator {
                font-size: 22px;
            }

            .wedding-section {
                height: 240px;
            }

            .rsvp-section {
                min-height: 300px;

                padding: 45px 12px;
            }

            .rsvp-heading {
                width: min(90%, 340px);

                margin-bottom: 20px;
            }

            .rsvp-buttons {
                gap: 8px;
            }

            .rsvp-button {
                min-width: 0;

                flex: 1 1 0;

                padding: 10px 6px;

                font-size: 7px;

                letter-spacing: 0.6px;
            }

            .story-overlay {
                padding: 75px 8px 16px;

                gap: 12px;
            }

            .story-slider-area {
                height: min(42vh, 320px);

                margin-top: 117px;
            }

            .story-card {
                width: min(66vw, 250px);

                border-radius: 14px;
            }

            .story-navigation {
                gap: 26px;
            }

            .story-nav-btn {
                font-size: 46px;
            }

            .story-close {
                width: 36px;
                height: 36px;

                top: 12px;
                right: 12px;

                font-size: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================
         FIRST OPENING PAGE (VIDEO)
    ========================================= -->

    <div
        class="opening-page"
        id="openingPage"
        role="button"
        tabindex="0"
        aria-label="Tap to play and open invitation"
    >

        <video
            class="opening-page-video"
            id="openingVideo"
            src="./video.mp4"
            playsinline
            webkit-playsinline="true"
            muted
            preload="auto"
        ></video>

    </div>


    <div class="site" id="siteContent">

        <main class="second-page">


            <!-- ENVELOPE -->

            <section class="envelope-section">
<!-- 
                <img
                    class="floral-deco deco-tr"
                    src="./flower.png"
                    alt=""
                > -->

                <div class="envelope-wrapper">

                    <img
                        class="envelope-card"
                        src="./envelope open.png"
                        alt="Envelope with photo"
                    >

                </div>

            </section>


            <!-- NOTE -->

            <section class="note-section">

                <div class="note-wrapper">

                    <img
                        class="note-card"
                        src="./note.png"
                        alt="A little note"
                    >

                </div>

            </section>


            <!-- POST CARD -->

            <section class="story-card-section">

                <!-- <img
                    class="floral-deco deco-bl"
                    src="./flower.png"
                    alt=""
                > -->

                <div class="story-card-wrapper">

                    <img
                        class="post-card"
                        src="./post card.png"
                        alt="Our Story"
                        onclick="openStory()"
                    >

                    <img
                        class="vinyl"
                        id="vinylPlayer"
                        src="./vinyl.png"
                        alt="Play Music"
                        onclick="toggleStoryAudio()"
                    >

                    <audio
                        id="storyAudio"
                        src="https://cdn.shopify.com/s/files/1/0778/9474/6301/files/videoplayback_1.mp3?v=1788118092"
                        preload="none"
                    ></audio>

                </div>

            </section>


            <!-- COUNTDOWN -->

            <section class="countdown-section">

                <img
                    class="countdown-heading"
                    src="./Group 8.png"
                    alt="The next chapter begins in"
                >

                <div class="countdown">

                    <div class="time-box">

                        <div
                            class="time-number"
                            id="days"
                        >
                            00
                        </div>

                        <div class="time-label">
                            DAYS
                        </div>

                    </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        <div
                            class="time-number"
                            id="hours"
                        >
                            00
                        </div>

                        <div class="time-label">
                            HOURS
                        </div>

                    </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        <div
                            class="time-number"
                            id="minutes"
                        >
                            00
                        </div>

                        <div class="time-label">
                            MINUTES
                        </div>

                    </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        <div
                            class="time-number"
                            id="seconds"
                        >
                            00
                        </div>

                        <div class="time-label">
                            SECONDS
                        </div>

                    </div>

                </div>

            </section>


            <!-- WEDDING IMAGE -->

            <section class="wedding-section">

                <img
                    class="wedding-image"
                    src="./wedding.png"
                    alt="Wedding"
                >

            </section>


            <!-- RSVP -->

            <section class="rsvp-section">

                <!-- <img
                    class="floral-deco deco-br"
                    src="./flower.png"
                    alt=""
                > -->

                <div class="rsvp-content">

                    <img
                        class="rsvp-heading"
                        src="./Group 9.png"
                        alt="So will you be there? We would love to celebrate this special day with you"
                    >

                    <div class="rsvp-buttons">

                        <!-- <button
                            class="rsvp-button yes-button"
                            onclick="rsvpYes()"
                        >
                            YES, COUNT US IN!
                        </button> -->

                        <!-- <button
                            class="rsvp-button no-button"
                            onclick="rsvpNo()"
                        >
                            SADLY, CAN'T MAKE IT
                        </button> -->

                    </div>

                </div>

            </section>


            <!-- LEAF DECORATION -->

            <img
                class="leaf-deco"
                src="./leaf.png"
                alt=""
            >

        </main>


        <!-- OUR STORY OVERLAY -->

        <div
            class="story-overlay"
            id="storyOverlay"
        >

            <button
                class="story-close"
                onclick="closeStory()"
                aria-label="Close"
            >
                ×
            </button>


            <div
                class="story-slider-area"
                id="storySlider"
            >

                <div class="story-card">
                

                    <img
                        class="story-image"
                        src="./1 (1).png"
                        alt="Our Story 2020"
                    >
                </div>


                <div class="story-card">
           

                    <img
                        class="story-image"
                        src="./2.png"
                        alt="Our Story 2021"
                    >
                </div>


                <div class="story-card">
            

                    <img
                        class="story-image"
                        src="./3 (1).png"
                        alt="Our Story 2022"
                    >
                </div>


                <div class="story-card">
   

                    <img
                        class="story-image"
                        src="./4.png"
                        alt="Our Story 2023"
                    >
                </div>


                <div class="story-card">
              

                    <img
                        class="story-image"
                        src="./5.png"
                        alt="Our Story 2024"
                    >
                </div>


                <div class="story-card">
               

                    <img
                        class="story-image"
                        src="./6.png"
                        alt="Our Story 2025"
                    >
                </div>


                <div class="story-card">
  

                    <img
                        class="story-image"
                        src="./7 (1).png"
                        alt="Our Story 2026"
                    >
                </div>

            </div>


            <div class="story-navigation">

                <button
                    class="story-nav-btn"
                    onclick="changeStory(-1)"
                    aria-label="Previous Story"
                >
                    &lt;
                </button>

                <button
                    class="story-nav-btn"
                    onclick="changeStory(1)"
                    aria-label="Next Story"
                >
                    &gt;
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           COUNTDOWN
        ========================================= */

        const weddingDate =
            new Date(
                "January 27, 2027 00:00:00"
            ).getTime();


        function updateCountdown() {

            const now =
                new Date().getTime();

            const distance =
                weddingDate - now;


            if (distance <= 0) {

                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";

                return;
            }


            const days =
                Math.floor(
                    distance /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            const hours =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    )
                    /
                    (
                        1000 *
                        60 *
                        60
                    )
                );


            const minutes =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60 *
                            60
                        )
                    )
                    /
                    (
                        1000 *
                        60
                    )
                );


            const seconds =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60
                        )
                    )
                    /
                    1000
                );


            document
                .getElementById("days")
                .innerText =
                String(days)
                .padStart(2, "0");


            document
                .getElementById("hours")
                .innerText =
                String(hours)
                .padStart(2, "0");


            document
                .getElementById("minutes")
                .innerText =
                String(minutes)
                .padStart(2, "0");


            document
                .getElementById("seconds")
                .innerText =
                String(seconds)
                .padStart(2, "0");

        }


        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );


        /* =========================================
           RSVP
        ========================================= */

        const rsvpWhatsAppNumber = "919910948594";


        function rsvpYes() {

            const message =
                "Hi! I'm excited to confirm — count us in for Hetvi & Manan's wedding! ❤️";

            window.open(
                "https://wa.me/" +
                rsvpWhatsAppNumber +
                "?text=" +
                encodeURIComponent(message),
                "_blank"
            );

        }


        function rsvpNo() {

            const message =
                "Hi! Sadly, I won't be able to make it to Hetvi & Manan's wedding. Sending my love and best wishes! ❤️";

            window.open(
                "https://wa.me/" +
                rsvpWhatsAppNumber +
                "?text=" +
                encodeURIComponent(message),
                "_blank"
            );

        }


        /* =========================================
           VINYL MUSIC
        ========================================= */

        const storyAudio =
            document.getElementById(
                "storyAudio"
            );

        const vinylPlayer =
            document.getElementById(
                "vinylPlayer"
            );


        function toggleStoryAudio() {

            if (storyAudio.paused) {

                storyAudio.play();

                vinylPlayer.classList.add(
                    "is-playing"
                );

            } else {

                storyAudio.pause();

                vinylPlayer.classList.remove(
                    "is-playing"
                );

            }

        }


        storyAudio.addEventListener(
            "ended",
            function () {

                vinylPlayer.classList.remove(
                    "is-playing"
                );

            }
        );


        /* =========================================
           OUR STORY SLIDER
        ========================================= */

        const storyOverlay =
            document.getElementById(
                "storyOverlay"
            );

        const storyCards =
            document.querySelectorAll(
                ".story-card"
            );

        let currentStory = 0;


        function openStory() {

            storyOverlay.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

            updateStorySlider();

        }


        function closeStory() {

            storyOverlay.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        function changeStory(direction) {

            currentStory =
                (
                    currentStory +
                    direction +
                    storyCards.length
                )
                %
                storyCards.length;

            updateStorySlider();

        }


        function updateStorySlider() {

            const total =
                storyCards.length;


            const previous =
                (
                    currentStory -
                    1 +
                    total
                )
                %
                total;


            const next =
                (
                    currentStory +
                    1
                )
                %
                total;


            storyCards.forEach(
                function(card, index) {

                    card.classList.remove(
                        "active",
                        "prev",
                        "next",
                        "hidden-left",
                        "hidden-right"
                    );


                    if (index === currentStory) {

                        card.classList.add(
                            "active"
                        );

                    }

                    else if (index === previous) {

                        card.classList.add(
                            "prev"
                        );

                    }

                    else if (index === next) {

                        card.classList.add(
                            "next"
                        );

                    }

                    else {

                        const distance =
                            (
                                index -
                                currentStory +
                                total
                            )
                            %
                            total;


                        if (
                            distance >
                            total / 2
                        ) {

                            card.classList.add(
                                "hidden-left"
                            );

                        } else {

                            card.classList.add(
                                "hidden-right"
                            );

                        }

                    }

                }
            );

        }


        /* =========================================
           TOUCH SWIPE (mobile story slider)
        ========================================= */

        const storySliderArea =
            document.getElementById(
                "storySlider"
            );

        let touchStartX = 0;
        let touchStartY = 0;
        let touchActive = false;

        storySliderArea.addEventListener(
            "touchstart",
            function (event) {

                if (event.touches.length !== 1) {
                    return;
                }

                touchActive = true;
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;

            },
            { passive: true }
        );

        storySliderArea.addEventListener(
            "touchend",
            function (event) {

                if (!touchActive) {
                    return;
                }

                touchActive = false;

                const touch = event.changedTouches[0];

                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;

                /* Only treat it as a swipe if the horizontal
                   movement clearly outweighs vertical movement,
                   so normal up/down scrolling isn't hijacked. */

                if (
                    Math.abs(deltaX) > 40 &&
                    Math.abs(deltaX) > Math.abs(deltaY) * 1.5
                ) {

                    if (deltaX < 0) {

                        changeStory(1);

                    } else {

                        changeStory(-1);

                    }

                }

            },
            { passive: true }
        );


        /* =========================================
           KEYBOARD NAVIGATION (story slider)
        ========================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    !storyOverlay
                    .classList
                    .contains("active")
                ) {
                    return;
                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    changeStory(-1);

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    changeStory(1);

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeStory();

                }

            }
        );


        /* =========================================
           FIRST PAGE: VIDEO -> OPEN MAIN SITE
        ========================================= */

        const openingPage =
            document.getElementById(
                "openingPage"
            );

        const openingVideo =
            document.getElementById(
                "openingVideo"
            );

        const siteContent =
            document.getElementById(
                "siteContent"
            );

        let invitationOpened = false;
        let videoStarted = false;


        /* Show the video's own first frame as the "poster" instead
           of a black box. Seeking to a tiny offset forces mobile
           browsers to decode and paint that frame without needing
           an actual playback attempt (which mobile browsers are
           more likely to block before the user has tapped). As a
           belt-and-suspenders fallback, we also try a quick muted
           play+pause once the seek lands, since some browsers only
           paint a frame after playback has briefly started. */

        function primeFirstFrame() {

            function trySeek() {

                try {

                    openingVideo.currentTime = 0.05;

                } catch (e) {}

            }

            if (openingVideo.readyState >= 1) {

                trySeek();

            } else {

                openingVideo.addEventListener(
                    "loadedmetadata",
                    trySeek,
                    { once: true }
                );

            }

            openingVideo.addEventListener(
                "seeked",
                function onSeeked() {

                    const primePromise = openingVideo.play();

                    if (primePromise !== undefined) {

                        primePromise
                            .then(function () {

                                openingVideo.pause();

                            })
                            .catch(function () {

                                /* Autoplay blocked entirely; the
                                   seeked frame above should still
                                   be visible on its own. */

                            });

                    }

                },
                { once: true }
            );

        }


        openingVideo.load();
        primeFirstFrame();

        document.body.style.overflow = "hidden";


        function openMainWebsite() {

            if (invitationOpened) {
                return;
            }

            invitationOpened = true;

            document.body.style.overflow = "";

            /* The site is already sitting in place underneath the
               opening page, but each section starts shifted down
               and invisible. Fading the opening page out while
               adding "revealed" lets every section slide up into
               place one after another, bottom to top. */

            openingPage.classList.add(
                "hide"
            );

            siteContent.classList.add(
                "revealed"
            );

        }


        function playOpeningVideo() {

            if (videoStarted || invitationOpened) {
                return;
            }

            videoStarted = true;

            openingPage.classList.add("playing");

            openingVideo.currentTime = 0;
            openingVideo.playbackRate = 2;

            const playPromise = openingVideo.play();

            /* If autoplay is blocked, fall back to opening
               the site right away instead of leaving the
               invitation stuck. */
            if (playPromise !== undefined) {

                playPromise.catch(function () {

                    openMainWebsite();

                });

            }

        }


        /* When the video finishes playing, reveal the site */

        openingVideo.addEventListener(
            "ended",
            openMainWebsite
        );


        /* CLICK / TAP: first tap plays the video */

        openingPage.addEventListener(
            "click",
            playOpeningVideo
        );


        /* KEYBOARD */

        openingPage.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    playOpeningVideo();

                }

            }
        );


        /* INITIALIZE SLIDER */

        updateStorySlider();

    </script>

</body>
</html>
